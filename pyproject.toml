[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ssmp"
description = "A model of the Sony S-SMP, the audio unit: a processor, a sound generator and the boot program between them."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dynamic = ["version"]
keywords = ["s-smp", "spc700", "s-dsp", "snes", "audio", "emulator", "conformance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Emulators",
]

[project.urls]
Homepage = "https://github.com/gufranco/sony-s-smp-python"
Source = "https://github.com/gufranco/sony-s-smp-python"
Issues = "https://github.com/gufranco/sony-s-smp-python/issues"

[project.scripts]
ssmp-doctor = "ssmp.doctor:main"

[tool.setuptools]
packages = ["ssmp"]

[tool.setuptools.dynamic]
version = { attr = "ssmp.version.VERSION" }

[tool.setuptools.package-data]
ssmp = ["artifacts.manifest.json"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PL", "BLE", "C4", "N", "A", "T20", "PTH"]
ignore = [
  "PLR0913",
  "PLR2004",
  "PLR0912",
  "PLR0915",
  "PLR0911",
  "PLC0415",
  "PLR0917",
  "E501",
  "N818",
]

[tool.ruff.lint.per-file-ignores]
"ssmp/environment.py" = ["BLE001", "T201"]
"*.test.py" = ["PLR2004", "N999"]
"conformance/*.py" = ["T201"]
"ssmp/doctor.py" = ["BLE001", "T201"]

[tool.mypy]
strict = true
python_version = "3.12"
warn_unreachable = true
warn_no_return = true
strict_equality = true
extra_checks = true
enable_error_code = [
  "explicit-override",
  "ignore-without-code",
  "possibly-undefined",
  "redundant-expr",
  "truthy-bool",
  "truthy-iterable",
  "unused-awaitable",
]
files = ["ssmp", "conformance"]

[tool.coverage.run]
source = ["."]
omit = [
  "sony-spc700-python/*",
  "sony-s-dsp-python/*",
  "mos65xx-python/*",
  "conformance/boot.test.py",
  "conformance/loader.test.py",
]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = [
  'if __name__ == "__main__":',
  'if str\(ROOT\) not in sys\.path:',
  'if TYPE_CHECKING:',
  '^\s*\.\.\.$',
  ': \.\.\.$',
  '@unittest\.skipUnless\(CLOCKED,',
  '@unittest\.skipUnless\(A_PART,',
  '@unittest\.skipUnless\(A_PART and BUILDABLE,',
  '^def accounts_for_a_reset\(',
  '@unittest\.skipUnless\(QUOTED,',
  '@unittest\.skipUnless\(VARIANTS,',
  '^def built\(',
  '@unittest\.skipUnless\(SOLD_AS_A_COMPONENT,',
  '^def machine_mentions\(',
  '^def listing\(',
]

[[tool.mypy.overrides]]
module = ["spc700.*", "sdsp.*", "mos65xx.*"]
follow_imports = "skip"
ignore_missing_imports = true
