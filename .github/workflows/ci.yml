---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pipx install ruff==0.16.3

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check --output-format=github .

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install the formatter
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check that every file Prettier reads is formatted
        run: pnpm run format:check

      - name: Check the workflows themselves, with an archive verified by digest
        run: |
          releases="https://github.com/rhysd/actionlint/releases/download"
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o actionlint.tar.gz \
            "${releases}/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color
          rm -f actionlint actionlint.tar.gz
        shell: bash
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"

      - name: Lint every YAML file
        run: |
          pipx install yamllint==1.38.0
          yamllint --strict .

  types:
    name: Types
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install mypy and the build backend's stubs
        run: |
          pipx install mypy==1.14.1
          pipx inject mypy types-setuptools==84.0.0.20260812

      - name: Check types, strictly, as configured in pyproject.toml
        run: mypy

  test:
    name: Tests on Python ${{ matrix.python }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install coverage and the build backend its tests drive
        run: |
          python -m pip install --disable-pip-version-check \
            coverage==7.6.10 setuptools==84.0.0

      - name: Run every test file, under coverage
        run: |
          python -m coverage erase
          status=0
          while IFS= read -r file; do
            echo "::group::${file}"
            python -m coverage run -a "${file}" || status=1
            echo "::endgroup::"
          done < <(find ssmp conformance -name '*.test.py' | sort)
          exit "${status}"
        shell: bash

      - name: Coverage must be total
        run: python -m coverage report

  speed:
    name: Throughput
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: The unit must still run faster than the floor, when a boot program is here
        run: |
          set +e
          python -m conformance.speed
          status=$?
          set -e
          if [ "${status}" -eq 2 ]; then
            said="The throughput floor was not measured."
            said="${said} It is not a failure; there was nothing to run."
            echo "::notice title=No boot program present::${said}"
            exit 0
          fi
          exit "${status}"
        shell: bash

  boot:
    name: The console protocol, played at the unit
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Say on the run page whether the unit was driven at all
        run: |
          set +e
          python -c "
          import sys
          sys.path.insert(0, '.')
          import ssmp
          reason = ssmp.why_not()
          print(reason if reason else '')
          raise SystemExit(2 if reason else 0)
          " > reason.txt
          status=$?
          set -e
          if [ "${status}" -eq 2 ]; then
            echo "::notice title=No boot program present::$(cat reason.txt)"
            exit 0
          fi
          said="The console protocol was played at the unit end to end."
          echo "::notice title=Boot program present::${said}"
          exit "${status}"
        shell: bash

      - name: Play it
        run: python3 conformance/boot.test.py

  checks:
    name: Checks taken on real hardware
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run every check that is on this machine, where exit two means none was
        run: |
          set +e
          python3 -m conformance.against_checks > said.txt
          status=$?
          set -e
          cat said.txt
          if [ "${status}" -eq 2 ]; then
            echo "::notice title=Nothing was checked::$(head -1 said.txt)"
            exit 0
          fi
          if [ "${status}" -eq 0 ]; then
            echo "::notice title=Agreed::$(tail -1 said.txt)"
          fi
          exit "${status}"
        shell: bash

  package:
    name: package
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .

      - name: Every module ships and no test does
        run: python -m conformance.package dist/ssmp-*.whl
